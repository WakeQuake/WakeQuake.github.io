<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WakeQuake</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Full-Width Sticky Top Navigation Bar Following Scroll -->
  <header class="top-navbar">
    <div class="top-navbar-inner">
      <!-- Brand Logo linking to Home Page -->
      <a href="index.html" class="brand-title">WakeQuake</a>

      <!-- Navigation links: Special Home button (no emoji), Product Features, Pricing, Team -->
      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html" class="nav-item special-home-btn active">Home</a>
        <a href="features.html" class="nav-item">Product Features</a>
        <a href="pricing.html" class="nav-item">Pricing</a>
        <a href="team.html" class="nav-item">Team</a>
      </nav>
    </div>
  </header>

  <div class="app-frame">
    <!-- Top Right Decorative Controls from Blueprint -->
    <div class="window-controls">
      <div class="window-btn"></div>
      <div class="window-btn"></div>
      <div class="window-btn"></div>
    </div>

    <!-- Workspace Layout -->
    <div class="layout-wrapper">
      
      <!-- Fixed Sidebar with non-clickable buttons -->
      <aside class="sidebar">
        <div class="sidebar-title-pill">Our varieties</div>
        
        <div class="variety-item" style="margin-top: 14px;"></div>
        <div class="variety-item"></div>
        <div class="variety-item"></div>
      </aside>

      <!-- Fixed Main Column -->
      <main class="main-content">
        <section class="hero-card">
          <img class="hero-image" src="https://images.unsplash.com/photo-1542435503-956c469947f6?auto=format&fit=crop&q=80&w=800" alt="Smart alarm" />
        </section>

        <section class="features-card">
          <div class="features-title">Features</div>
          <p class="features-text">Smart digital alarm with rotating projector, automatic synchronization, and built-in fast loading interface.</p>
        </section>
      </main>

    </div>
  </div>

</body>
</html>
