<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WakeQuake - Product Features</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Persistent top navbar -->
  <header class="top-navbar">
    <div class="top-navbar-inner">
      <!-- Name linking to index.html -->
      <a href="index.html" class="brand-title">WakeQuake</a>

      <!-- Navigation links: Home, Product Features (active), Pricing, Team -->
      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html" class="nav-item special-home-btn">Home</a>
        <a href="features.html" class="nav-item active">Product Features</a>
        <a href="pricing.html" class="nav-item">Pricing</a>
        <a href="team.html" class="nav-item">Team</a>
      </nav>
    </div>
  </header>

  <div class="app-frame">

    <!-- ADDED: Top decorative window controls (the three dashes) -->
    <div class="window-controls">
      <div class="window-btn"></div>
      <div class="window-btn"></div>
      <div class="window-btn"></div>
    </div>

    <!-- Layout -->
    <div class="layout-wrapper">
      
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-title-pill">Features</div>
        
        <!--3 grey placeholder blocks -->
        <nav class="fnav" aria-label="Features">
          <a href="#feature-1"><span class="dot yellow" aria-hidden="true"></span>Feature 1</a>
          <a href="#feature-2"><span class="dot cyan" aria-hidden="true"></span>Feature 2</a>
          <a href="#feature-3"><span class="dot purple" aria-hidden="true"></span>Feature 3</a>
          <a href="#feature-4"><span class="dot coral" aria-hidden="true"></span>Feature 4</a>
        </nav>
      </aside>

      <!-- Main content-->
      <main class="main-content">
        <section class="features-card">
          <h1 class="page-title">Product Features</h1>
          
          <!-- 4 mockup cards -->
          <div class="fgrid">
            <a class="fcard" id="feature-1" href="#feature-1">
              <div class="flabel"><span class="dot yellow" aria-hidden="true"></span>Feature 1</div>
            </a>
            <a class="fcard" id="feature-2" href="#feature-2">
              <div class="flabel"><span class="dot cyan" aria-hidden="true"></span>Feature 2</div>
            </a>
            <a class="fcard" id="feature-3" href="#feature-3">
              <div class="flabel"><span class="dot purple" aria-hidden="true"></span>Feature 3</div>
            </a>
            <a class="fcard" id="feature-4" href="#feature-4">
              <div class="flabel"><span class="dot coral" aria-hidden="true"></span>Feature 4</div>
            </a>
          </div>
        </section>
      </main>

    </div>
  </div>
</body>
</html>
