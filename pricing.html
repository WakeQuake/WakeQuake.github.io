<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WakeQuake - Pricing</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

  <!-- Full-Width Sticky Top Navigation Bar -->
  <header class="top-navbar">
    <div class="top-navbar-inner">
      <!-- Brand Logo linking to Home Page -->
      <a href="index.html" class="brand-title">WakeQuake</a>

      <!-- Navigation links: Special Home button (no emoji), Product Features, Pricing (active), Team -->
      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html" class="nav-item special-home-btn">Home</a>
        <a href="features.html" class="nav-item">Product Features</a>
        <a href="pricing.html" class="nav-item active">Pricing</a>
        <a href="team.html" class="nav-item">Team</a>
      </nav>
    </div>
  </header>

  <div class="app-frame">
    <!-- Top Decorative Window Controls -->
    <div class="window-controls">
      <div class="window-btn"></div>
      <div class="window-btn"></div>
      <div class="window-btn"></div>
    </div>

    <!-- Workspace Layout -->
    <div class="layout-wrapper">
      
      <!-- Fixed Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-title-pill">Pricing</div>
        
        <div class="variety-item" style="margin-top: 14px;"></div>
        <div class="variety-item"></div>
        <div class="variety-item"></div>
      </aside>

      <!-- Fixed Main Column -->
      <main class="main-content">
        <section class="pricing-card-container">
          <h1 class="page-title">Pricing</h1>

          <!-- Clean Pricing Grid without filler features, guarantees, or discount boxes -->
          <div class="pricing-grid">
            <div class="pricing-card">
              <div>
                <h2 class="tier-name">Student Edition</h2>
                <div class="tier-price-box">
                  <span class="tier-price">$49</span>
                  <span class="tier-period">CAD</span>
                </div>
              </div>
              <a href="#" class="tier-btn">Select</a>
            </div>

            <div class="pricing-card">
              <div>
                <h2 class="tier-name">Pro Edition</h2>
                <div class="tier-price-box">
                  <span class="tier-price">$89</span>
                  <span class="tier-period">CAD</span>
                </div>
              </div>
              <a href="#" class="tier-btn">Select</a>
            </div>

            <div class="pricing-card">
              <div>
                <h2 class="tier-name">Vision Deluxe</h2>
                <div class="tier-price-box">
                  <span class="tier-price">$139</span>
                  <span class="tier-period">CAD</span>
                </div>
              </div>
              <a href="#" class="tier-btn">Select</a>
            </div>
          </div>
        </section>
      </main>

    </div>
  </div>

</body>
</html>
