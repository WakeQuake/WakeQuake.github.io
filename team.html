<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="styles.css" />

<body>

  <!-- top nav -->
  <header class="top-navbar">

      <!-- logo -->
      <a href="index.html" class="brand-title">WakeQuake</a>

      <!--nav 2 -->

      <nav class="nav-links" id="navLinks" aria-label="Main navigation">

            <div class="member-card" id="member-hk">

              <h2 class="member-name">Hermann Kouonang Fipa</h2>
              <span class="member-id-pill">ID: 300566236</span>
            </div>

            <div class="member-card" id="member-po">
              <img class="avatar-pill" src="team/Princess_Icon.jpeg" alt="Princess Obeng Asante" />

            <div class="member-card" id="member-sh">

              <h2 class="member-name">Zoe Sura Ortega</h2>
              <span class="member-id-pill">ID: 300518014</span>
            </div>
          </div>
        </section>
      </main>

    </div>
  </div>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <span class="footer-copyright">&copy; WakeQuake Team 2026</span>
    </div>

  <script src="app.js"></script>
